<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Cards Against Humanity in Japanese</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg: #000000;
            --text: #ffffff;
            --muted: #888888;
            --border: #333333;
            --card-bg: #000000;
            --card-text: #ffffff;
            --card-border: #ffffff;
            --card-radius: 12px;
            --card-ans-bg: #ffffff;
            --card-ans-text: #000000;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: 'Zen Kaku Gothic New', -apple-system, sans-serif;
            overflow-x: hidden;
        }

        #app {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        button,
        input {
            font-family: inherit;
        }

        button {
            cursor: pointer;
            border: none;
            background: none;
            color: inherit;
        }

        .wrap {
            max-width: 480px;
            margin: 0 auto;
            width: 100%;
            padding: 24px 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .center-wrap {
            max-width: 480px;
            margin: 0 auto;
            width: 100%;
            padding: 24px 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .brand {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand-title {
            font-size: 32px;
            font-weight: 900;
            margin: 0 0 8px;
            letter-spacing: -0.02em;
        }

        .brand-sub {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.6;
            margin: 0;
        }

        .panel {
            border: 1px solid var(--border);
            border-radius: var(--card-radius);
            padding: 20px;
            background: var(--bg);
        }

        .field-label {
            font-size: 12px;
            color: var(--muted);
            margin: 0 0 6px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .text-input {
            width: 100%;
            background: #000;
            border: 1px solid var(--border);
            color: #fff;
            border-radius: var(--card-radius);
            padding: 12px 14px;
            font-size: 15px;
            outline: none;
            margin-bottom: 14px;
        }

        .text-input:focus {
            border-color: #fff;
        }

        .text-input.code-input {
            letter-spacing: 0.2em;
            text-transform: uppercase;
            font-weight: 700;
            font-size: 18px;
            text-align: center;
        }

        .btn {
            border-radius: var(--card-radius);
            padding: 12px 16px;
            font-weight: 700;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            transition: opacity 0.1s;
        }

        .btn:active {
            opacity: 0.7;
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .btn-primary {
            background: #ffffff;
            color: #000000;
        }

        .btn-ghost {
            background: transparent;
            border: 1px solid var(--border);
            color: #ffffff;
        }

        .btn-sm {
            padding: 8px 12px;
            font-size: 12px;
            width: auto;
        }

        .err-msg {
            color: #ffffff;
            font-size: 12px;
            margin-top: 10px;
            text-align: center;
            text-decoration: underline;
        }

        .rules-note {
            margin-top: 20px;
            font-size: 12px;
            color: var(--muted);
            text-align: center;
            line-height: 1.6;
        }

        .room-code-plate {
            text-align: center;
            border: 1px solid var(--border);
            border-radius: var(--card-radius);
            padding: 20px;
            margin-bottom: 16px;
        }

        .room-code-label {
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 0.1em;
            font-weight: 700;
        }

        .room-code-value {
            font-weight: 900;
            font-size: 36px;
            letter-spacing: 0.1em;
            margin: 4px 0;
        }

        .room-code-hint {
            font-size: 12px;
            color: var(--muted);
        }

        .player-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 16px 0;
        }

        .player-row {
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid var(--border);
            border-radius: var(--card-radius);
            padding: 10px 14px;
        }

        .avatar-chip {
            width: 28px;
            height: 28px;
            border-radius: var(--card-radius);
            border: 1px solid #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 12px;
            background: #000;
            color: #fff;
        }

        .player-name {
            font-weight: 700;
            font-size: 14px;
            flex: 1;
        }

        .host-badge {
            font-size: 10px;
            border: 1px solid #fff;
            padding: 2px 6px;
            border-radius: var(--card-radius);
        }

        .section-title {
            font-size: 12px;
            color: var(--muted);
            font-weight: 700;
            margin: 16px 0 8px;
        }

        .score-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: #000;
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .score-chip {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid var(--border);
            border-radius: var(--card-radius);
            padding: 4px 8px;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
        }

        .score-chip.is-judge {
            border-color: #fff;
            background: #fff;
            color: #000;
        }

        .score-chip.is-me:not(.is-judge) {
            border-color: #ffffff;
            background: #222222;
        }

        .score-chip .sc-name {
            font-size: 12px;
            font-weight: 700;
        }

        .score-chip .sc-pts {
            font-weight: 900;
            font-size: 12px;
        }

        .stage-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px;
        }

        .round-tag {
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 0.1em;
            margin-bottom: 12px;
        }

        .prompt-card {
            width: 100%;
            max-width: 360px;
            border-radius: var(--card-radius);
            border: 1px solid var(--card-border);
            padding: 20px;
            background: var(--card-bg);
            color: var(--card-text);
        }

        .prompt-kind {
            font-size: 10px;
            color: var(--muted);
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .prompt-text {
            font-size: 17px;
            font-weight: 700;
            line-height: 1.5;
        }

        .prompt-blank {
            text-decoration: underline;
        }

        .judge-banner {
            border: 1px solid #fff;
            border-radius: var(--card-radius);
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 700;
            margin: 16px 0 4px;
        }

        .wait-msg {
            color: var(--muted);
            font-size: 13px;
            text-align: center;
            margin: 12px 0;
            line-height: 1.6;
        }

        .hand-zone {
            width: 100%;
            margin-top: auto;
            padding-top: 20px;
        }

        .hand-label {
            text-align: center;
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 10px;
            font-weight: 700;
        }

        .hand-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            max-width: 420px;
            margin: 0 auto;
        }

        .ans-card {
            background: var(--card-ans-bg);
            color: var(--card-ans-text);
            border-radius: var(--card-radius);
            padding: 12px;
            font-size: 13px;
            font-weight: 700;
            line-height: 1.4;
            min-height: 80px;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            cursor: pointer;
        }

        .ans-card:active {
            opacity: 0.8;
        }

        .judge-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            max-width: 360px;
            margin-top: 16px;
        }

        .judge-card {
            background: var(--card-ans-bg);
            color: var(--card-ans-text);
            border-radius: var(--card-radius);
            padding: 14px;
            font-size: 14px;
            font-weight: 700;
            line-height: 1.4;
            cursor: pointer;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
        }

        .winner-banner {
            text-align: center;
            margin: 16px 0 4px;
        }

        .winner-eyebrow {
            font-size: 11px;
            color: var(--muted);
            font-weight: 700;
            letter-spacing: 0.1em;
        }

        .winner-name {
            font-size: 22px;
            font-weight: 900;
            margin-top: 2px;
        }

        .winner-card {
            background: var(--card-ans-bg);
            color: var(--card-ans-text);
            border-radius: var(--card-radius);
            padding: 18px;
            max-width: 340px;
            width: 100%;
            font-size: 15px;
            font-weight: 700;
            line-height: 1.5;
            margin: 14px 0;
            border: 2px solid #fff;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
        }

        .final-board {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 20px 0;
            width: 100%;
        }

        .final-row {
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid var(--border);
            border-radius: var(--card-radius);
            padding: 10px 14px;
        }

        .final-row.champ {
            border-color: #fff;
            background: #fff;
            color: #000;
        }

        .final-rank {
            font-weight: 700;
            width: 16px;
        }

        .final-name {
            flex: 1;
            font-weight: 700;
            font-size: 14px;
        }

        .final-score {
            font-weight: 900;
        }

        .copy-toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #fff;
            color: #000;
            padding: 8px 16px;
            border-radius: var(--card-radius);
            font-size: 12px;
            font-weight: 700;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 100;
        }

        .copy-toast.show {
            opacity: 1;
        }

        .spinner {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid var(--border);
            border-top-color: #fff;
            animation: spin 0.6s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

        function currentJudge(room) {
            if (!room || !room.players || !room.players.length) return null;
            const idx = ((room.judgeIndex % room.players.length) + room.players.length) % room.players.length;
            return room.players[idx];
        }
        function currentPromptIdx(room) {
            if (!room || room.round < 1) return null;
            return room.promptOrder[(room.round - 1) % room.promptOrder.length];
        }
        function myPlayerIndex(room) {
            return room.players.findIndex(p => p.id === ME.id);
        }

        async function shareSiteUrl() {
            const shareData = {
                title: 'Cards Against Humanity in Japanese',
                text: 'お題×回答カードゲームで遊ぼう！',
                url: window.location.href
            };

            if (navigator.share) {
                try {
                    await navigator.share(shareData);
                } catch (err) {
                    if (err.name !== 'AbortError') {
                        copyToClipboard(window.location.href);
                    }
                }
            } else {
                copyToClipboard(window.location.href);
            }
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast('URLをコピーしました！');
            }).catch(() => {
                showToast('URLのコピーに失敗しました');
            });
        }

        async function createRoom() {
            if (!nameDraft.trim()) { createErr = 'なまえを入力してね'; render(); return; }
            busy = true; render();
            const code = genCode();
            if (!ME) ME = { id: genId(), name: nameDraft.trim() };
            else ME.name = nameDraft.trim();
            saveIdentity();

            const room = {
                code,
                hostId: ME.id,
                phase: 'lobby',
                players: [{ id: ME.id, name: ME.name, score: 0, joinIndex: 0 }],
                promptOrder: shuffleIdx(PROMPTS.length),
                answerOrder: shuffleIdx(ANSWERS.length),
                round: 0,
                judgeIndex: 0,
                createdAt: Date.now()
            };

            await set(ref(db, `rooms/${code}`), room);
            busy = false;
            ROOM_CODE = code; ROOM = room; SCREEN = 'lobby';
            subscribeToRoom(code);
            render();
        }

        async function joinRoom() {
            const code = joinCodeDraft.trim().toUpperCase();
            if (!nameDraft.trim()) { joinErr = 'なまえを入力してね'; render(); return; }
            if (code.length !== 4) { joinErr = '4文字のルームコードを入力してね'; render(); return; }
            busy = true; render();

            const snapshot = await get(ref(db, `rooms/${code}`));
            const room = snapshot.val();

            if (!room) { busy = false; joinErr = 'ルームが見つかりません'; render(); return; }

            if (!ME) ME = { id: genId(), name: nameDraft.trim() };
            else ME.name = nameDraft.trim();
            saveIdentity();

            let playersArr = room.players ? (Array.isArray(room.players) ? room.players : Object.values(room.players)) : [];
            const already = playersArr.some(p => p.id === ME.id);

            if (!already) {
                if (room.phase !== 'lobby') { busy = false; joinErr = 'このルームはすでにゲーム中です'; render(); return; }
                if (playersArr.length >= MAX_PLAYERS) { busy = false; joinErr = 'このルームは満員です'; render(); return; }

                playersArr.push({ id: ME.id, name: ME.name, score: 0, joinIndex: playersArr.length });
                await set(ref(db, `rooms/${code}/players`), playersArr);
            }

            busy = false;
            ROOM_CODE = code;
            SCREEN = room.phase === 'lobby' ? 'lobby' : 'game';
            subscribeToRoom(code);
            render();
        }

        async function startGame() {
            if (busy) return;
            busy = true; render();

            const hands = {};
            for (let i = 0; i < ROOM.players.length; i++) {
                const p = ROOM.players[i];
                const slice = ROOM.answerOrder.slice(i * RESERVOIR, (i + 1) * RESERVOIR);
                const hand = slice.slice(0, HAND_SIZE);
                hands[p.id] = { hand, drawPointer: HAND_SIZE };
            }

            await set(ref(db, `rooms/${ROOM_CODE}/hands`), hands);
            await set(ref(db, `rooms/${ROOM_CODE}/phase`), 'submitting');
            await set(ref(db, `rooms/${ROOM_CODE}/round`), 1);
            await set(ref(db, `rooms/${ROOM_CODE}/judgeIndex`), 0);

            SCREEN = 'game';
            busy = false;
            render();
        }

        async function submitAnswer(cardIdx) {
            if (busy) return;
            busy = true; render();

            const code = ROOM_CODE;
            const round = ROOM.round;
            const pid = ME.id;
            const h = MY_HAND;

            const newHand = [];
            let removed = false;
            for (const c of (h ? h.hand : [])) {
                if (!removed && c === cardIdx) { removed = true; continue; }
                newHand.push(c);
            }

            const pIdx = myPlayerIndex(ROOM);
            const reservoirStart = pIdx * RESERVOIR;
            const drawPointer = h ? h.drawPointer : HAND_SIZE;
            const nextIdx = ROOM.answerOrder[reservoirStart + drawPointer];
            const newDrawPointer = drawPointer + 1;

            if (nextIdx !== undefined) newHand.push(nextIdx);

            const updatedHandObj = { hand: newHand, drawPointer: newDrawPointer };
            const subObj = { playerId: pid, playerName: ME.name, cardIdx };

            await set(ref(db, `rooms/${code}/hands/${pid}`), updatedHandObj);
            await set(ref(db, `rooms/${code}/submissions/${round}/${pid}`), subObj);

            MY_HAND = updatedHandObj;
            MY_SUB = subObj;

            busy = false;
            render();
        }

        async function forceJudging() {
            if (busy) return;
            busy = true;
            await set(ref(db, `rooms/${ROOM_CODE}/phase`), 'judging');
            busy = false;
            render();
        }

        async function pickWinner(playerId, cardIdx) {
            if (busy) return;
            busy = true; render();

            const updatedPlayers = ROOM.players.map(p => {
                if (p.id === playerId) {
                    return { ...p, score: (p.score || 0) + 1 };
                }
                return p;
            });

            const winnerObj = { playerId, playerName: (ROOM.players.find(x => x.id === playerId) || {}).name || '', cardIdx };

            await set(ref(db, `rooms/${ROOM_CODE}/players`), updatedPlayers);
            await set(ref(db, `rooms/${ROOM_CODE}/winners/${ROOM.round}`), winnerObj);
            await set(ref(db, `rooms/${ROOM_CODE}/phase`), 'reveal');

            WINNER = winnerObj;
            busy = false;
            render();
        }

        async function doAdvance() {
            if (busy) return;
            busy = true;

            const champ = ROOM.players.find(p => (p.score || 0) >= TARGET_SCORE);

            if (champ) {
                await set(ref(db, `rooms/${ROOM_CODE}/phase`), 'gameover');
                await set(ref(db, `rooms/${ROOM_CODE}/championId`), champ.id);
            } else {
                await set(ref(db, `rooms/${ROOM_CODE}/round`), ROOM.round + 1);
                await set(ref(db, `rooms/${ROOM_CODE}/judgeIndex`), (ROOM.judgeIndex + 1) % ROOM.players.length);
                await set(ref(db, `rooms/${ROOM_CODE}/phase`), 'submitting');
            }

            busy = false;
            render();
        }

        async function playAgain() {
            if (busy) return;
            busy = true; render();

            const resetPlayers = ROOM.players.map(p => ({ ...p, score: 0 }));

            await set(ref(db, `rooms/${ROOM_CODE}/players`), resetPlayers);
            await set(ref(db, `rooms/${ROOM_CODE}/round`), 0);
            await set(ref(db, `rooms/${ROOM_CODE}/judgeIndex`), 0);
            await set(ref(db, `rooms/${ROOM_CODE}/championId`), null);
            await set(ref(db, `rooms/${ROOM_CODE}/promptOrder`), shuffleIdx(PROMPTS.length));
            await set(ref(db, `rooms/${ROOM_CODE}/answerOrder`), shuffleIdx(ANSWERS.length));
            await set(ref(db, `rooms/${ROOM_CODE}/phase`), 'lobby');

            SCREEN = 'lobby';
            busy = false;
            render();
        }

        function leaveRoom() {
            stopSubscription();
            ROOM_CODE = null; ROOM = null; MY_HAND = null; MY_SUB = null; SUBS = []; WINNER = null;
            SCREEN = 'home';
            render();
        }

        /* ================= UI EVENT BINDINGS ================= */
        window.onNameInput = (v) => { nameDraft = v; };
        window.onCodeInput = (v) => { joinCodeDraft = v.toUpperCase().slice(0, 4); };
        window.setHomeMode = (m) => { homeMode = m; createErr = ''; joinErr = ''; render(); };
        window.shareSiteUrl = shareSiteUrl;
        window.createRoom = createRoom;
        window.joinRoom = joinRoom;
        window.startGame = startGame;
        window.confirmSubmit = (idx) => { if (!busy) submitAnswer(idx); };
        window.forceJudging = forceJudging;
        window.confirmPick = (pId, idx) => { if (!busy) pickWinner(pId, idx); };
        window.doAdvance = doAdvance;
        window.playAgain = playAgain;
        window.leaveRoom = leaveRoom;

        /* ================= RENDERING ENGINE ================= */
        function render() {
            if (SCREEN === 'boot') { app.innerHTML = renderBoot(); return; }
            if (SCREEN === 'home') { app.innerHTML = renderHome(); return; }
            if (SCREEN === 'lobby') { app.innerHTML = renderLobby(); return; }
            if (SCREEN === 'game') { app.innerHTML = renderGame(); return; }
        }

        function renderBoot() {
            return `<div class="center-wrap"><span class="spinner"></span></div>`;
        }

        function renderHome() {
            const isCreate = homeMode === 'create';
            return `
  <div class="wrap">
    <div style="margin-top:4vh;">
      <div class="brand">
        <h1 class="brand-title">お題 × 回答</h1>
        <p class="brand-sub">お題に合った一番面白いカードを出す。<br>選ばれたら1pt。先に${TARGET_SCORE}pt獲った人が勝ち。</p>
      </div>

      <div class="panel">
        <div style="display:flex;gap:8px;margin-bottom:16px;">
          <button class="btn ${isCreate ? 'btn-primary' : 'btn-ghost'} btn-sm" style="flex:1" onclick="setHomeMode('create')">作成</button>
          <button class="btn ${!isCreate ? 'btn-primary' : 'btn-ghost'} btn-sm" style="flex:1" onclick="setHomeMode('join')">参加</button>
        </div>

        <div class="field-label">なまえ</div>
        <input class="text-input" placeholder="例）たかし" maxlength="12" value="${escapeHtml(nameDraft)}" oninput="onNameInput(this.value)">

        ${isCreate ? `
          <button class="btn btn-primary" onclick="createRoom()" ${busy ? 'disabled' : ''}>
            ${busy ? '<span class="spinner"></span>' : 'ルームを作成'}
          </button>
        ` : `
          <div class="field-label">ルームコード</div>
          <input class="text-input code-input" placeholder="ABCD" maxlength="4" value="${escapeHtml(joinCodeDraft)}" oninput="onCodeInput(this.value)">
          <button class="btn btn-primary" onclick="joinRoom()" ${busy ? 'disabled' : ''}>
            ${busy ? '<span class="spinner"></span>' : '参加する'}
          </button>
        `}
        <div class="err-msg">${escapeHtml(isCreate ? createErr : joinErr)}</div>
      </div>

      <button class="btn btn-ghost btn-sm" style="margin-top:16px; width:100%;" onclick="shareSiteUrl()">
        🔗 サイトのURLを共有
      </button>

      <p class="rules-note">3人以上でプレイ可能。お題役以外の全員がカードを提出し、お題役が判定します。</p>
    </div>
  </div>`;
        }

        function renderLobby() {
            const room = ROOM;
            const isHost = room && ME && room.hostId === ME.id;
            const canStart = room && room.players.length >= 3;
            const players = room ? room.players : [];
            return `
  <div class="wrap">
    <div class="room-code-plate">
      <div class="room-code-label">ROOM CODE</div>
      <div class="room-code-value">${escapeHtml(room.code)}</div>
      <div class="room-code-hint">参加者にコードを共有してください</div>
    </div>

    <div class="section-title">参加者（${players.length}/${MAX_PLAYERS}）</div>
    <div class="player-list">
      ${players.map(p => `
        <div class="player-row">
          <div class="avatar-chip">${escapeHtml(initials(p.name))}</div>
          <div class="player-name">${escapeHtml(p.name)}${p.id === ME.id ? ' (あなた)' : ''}</div>
          ${p.id === room.hostId ? '<span class="host-badge">HOST</span>' : ''}
        </div>
      `).join('')}
    </div>

    ${isHost ? `
      <button class="btn btn-primary" onclick="startGame()" ${(!canStart || busy) ? 'disabled' : ''} style="margin-top:8px;">
        ${busy ? '<span class="spinner"></span>' : (canStart ? 'ゲーム開始' : `あと${3 - players.length}人必要です`)}
      </button>
    ` : `
      <div class="wait-msg">ホストが開始するのを待っています...</div>
    `}
    <button class="btn btn-ghost btn-sm" style="margin-top:14px;align-self:center;" onclick="leaveRoom()">退出する</button>
  </div>`;
        }

        function renderGame() {
            const room = ROOM;
            if (!room) return renderBoot();
            const phase = room.phase;
            let body = '';
            if (phase === 'submitting') body = renderSubmitting();
            else if (phase === 'judging') body = renderJudging();
            else if (phase === 'reveal') body = renderReveal();
            else if (phase === 'gameover') body = renderGameover();
            else body = renderBoot();
            return `${renderScoreBar()}${body}`;
        }

        function renderScoreBar() {
            const room = ROOM;
            const judge = currentJudge(room);
            const sorted = [...room.players].sort((a, b) => (b.score || 0) - (a.score || 0));
            return `<div class="score-bar">
    ${sorted.map(p => `
      <div class="score-chip ${judge && p.id === judge.id ? 'is-judge' : ''} ${ME && p.id === ME.id ? 'is-me' : ''}">
        <div class="sc-name">${escapeHtml(p.name)}${ME && p.id === ME.id ? ' (あなた)' : ''}</div>
        <div class="sc-pts">${p.score || 0}</div>
      </div>
    `).join('')}
  </div>`;
        }

        function promptCardHtml(room) {
            const pIdx = currentPromptIdx(room);
            const text = PROMPTS[pIdx] || '';
            const withBlank = escapeHtml(text).replace(/_{3,}/g, '<span class="prompt-blank">_____</span>');
            return `<div class="prompt-card">
    <div class="prompt-kind"><span>お題</span><span>No.${String(pIdx + 1).padStart(3, '0')}</span></div>
    <div class="prompt-text">${withBlank}</div>
  </div>`;
        }

        function renderSubmitting() {
            const room = ROOM;
            const judge = currentJudge(room);
            const isJudge = judge && judge.id === ME.id;
            const need = room.players.length - 1;
            const have = SUBS.length;

            let lower;
            if (isJudge) {
                lower = `
      <div class="judge-banner">あなたは今ラウンドのお題役です</div>
      <div class="wait-msg">回答提出を待っています（${have}/${need}）</div>
      ${have > 0 ? `<button class="btn btn-ghost btn-sm" style="margin-top:12px;" onclick="forceJudging()">現在の回答で審査に進む</button>` : ''}
    `;
            } else if (MY_SUB) {
                lower = `
      <div class="wait-msg">提出完了。お題役の判定を待っています...</div>
      <div class="judge-grid">
        <div class="judge-card">${escapeHtml(ANSWERS[MY_SUB.cardIdx] || '')}</div>
      </div>
    `;
            } else {
                const hand = (MY_HAND && MY_HAND.hand) || [];
                lower = `
      <div class="hand-zone">
        <div class="hand-label">出したいカードを1枚選択</div>
        <div class="hand-grid">
          ${hand.map((idx) => `
            <div class="ans-card" onclick="confirmSubmit(${idx})">${escapeHtml(ANSWERS[idx] || '')}</div>
          `).join('')}
        </div>
      </div>
    `;
            }

            return `<div class="stage-area">
    <div class="round-tag">ROUND ${room.round}</div>
    ${promptCardHtml(room)}
    ${lower}
  </div>`;
        }

        function renderJudging() {
            const room = ROOM;
            const judge = currentJudge(room);
            const isJudge = judge && judge.id === ME.id;
            return `<div class="stage-area">
    <div class="round-tag">ROUND ${room.round} - 審査</div>
    ${promptCardHtml(room)}
    ${isJudge
                    ? `<div class="judge-banner">一番面白い回答を選択してください</div>`
                    : `<div class="wait-msg">${escapeHtml(judge ? judge.name : '')}さんが審査中...</div>`}
    <div class="judge-grid">
      ${SUBS.map(s => `
        <div class="judge-card" ${isJudge ? `onclick="confirmPick('${s.playerId}',${s.cardIdx})"` : ''}>
          ${escapeHtml(ANSWERS[s.cardIdx] || '')}
        </div>
      `).join('')}
    </div>
  </div>`;
        }

        function renderReveal() {
            const room = ROOM;
            const judge = currentJudge(room);
            const isJudge = judge && judge.id === ME.id;
            const w = WINNER;
            return `<div class="stage-area">
    <div class="round-tag">ROUND ${room.round} - 結果</div>
    ${promptCardHtml(room)}
    <div class="winner-banner">
      <div class="winner-eyebrow">勝者</div>
      <div class="winner-name">${w ? escapeHtml(w.playerName) : '…'}</div>
    </div>
    <div class="winner-card">${w ? escapeHtml(ANSWERS[w.cardIdx] || '') : ''}</div>
    ${isJudge
                    ? `<button class="btn btn-primary" onclick="doAdvance()" style="max-width:240px;">次のラウンドへ</button>`
                    : `<div class="wait-msg">お題役が進行するのを待っています...</div>`}
  </div>`;
        }

        function renderGameover() {
            const room = ROOM;
            const isHost = room.hostId === ME.id;
            const sorted = [...room.players].sort((a, b) => (b.score || 0) - (a.score || 0));
            const champ = room.players.find(p => p.id === room.championId) || sorted[0];
            return `<div class="wrap" style="justify-content:center; align-items:center;">
    <div style="text-align:center;">
      <div class="winner-eyebrow">CHAMPION</div>
      <div class="winner-name">${escapeHtml(champ ? champ.name : '')}</div>
    </div>
    <div class="final-board">
      ${sorted.map((p, i) => `
        <div class="final-row ${p.id === champ.id ? 'champ' : ''}">
          <div class="final-rank">${i + 1}</div>
          <div class="final-name">${escapeHtml(p.name)}</div>
          <div class="final-score">${p.score || 0}pt</div>
        </div>
      `).join('')}
    </div>
    ${isHost
                    ? `<button class="btn btn-primary" onclick="playAgain()" ${busy ? 'disabled' : ''}>もう一度遊ぶ</button>`
                    : `<div class="wait-msg">ホストが開始するのを待っています...</div>`}
    <button class="btn btn-ghost btn-sm" style="margin-top:12px;" onclick="leaveRoom()">退出する</button>
  </div>`;
        }

        function boot() {
            loadIdentity();
            if (ME) nameDraft = ME.name;
            SCREEN = 'home';
            render();
        }

        boot();
    </script>
</body>

</html>
